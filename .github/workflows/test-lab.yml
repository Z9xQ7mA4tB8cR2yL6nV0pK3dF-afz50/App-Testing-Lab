name: App Testing Lab

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'APK file URL (Google Drive, direct link, etc.)'
        required: true
        type: string
      package_name:
        description: 'App package name (e.g., com.example.app)'
        required: true
        type: string
      test_depth:
        description: 'Test depth: quick (15 steps), normal (50 steps), deep (100 steps)'
        required: false
        default: 'normal'
        type: choice
        options:
          - quick
          - normal
          - deep

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 28
            device: 'pixel'
            screen: '1080x1920'
            density: 420
          - api-level: 31
            device: 'pixel_6'
            screen: '1080x2400'
            density: 411
          - api-level: 34
            device: 'pixel_7_pro'
            screen: '1440x3120'
            density: 560

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Emulator and Test App
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: ${{ matrix.device }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            set -e
            
            echo "=== Emulator Info ==="
            adb wait-for-device
            adb shell getprop ro.build.version.sdk
            adb shell wm size
            adb shell wm density
            
            echo "=== Creating directories ==="
            mkdir -p artifacts/screenshots artifacts/reports artifacts/logs
            
            echo "=== Downloading APK ==="
            wget -q "${{ inputs.apk_url }}" -O app.apk
            ls -lh app.apk
            
            echo "=== Installing APK ==="
            adb install app.apk
            sleep 2
            
            echo "=== Launching App ==="
            PACKAGE="${{ inputs.package_name }}"
            ACTIVITY=$(adb shell cmd package resolve-activity --brief "$PACKAGE" | tail -n 1)
            echo "Activity: $ACTIVITY"
            adb shell am start -n "$ACTIVITY"
            sleep 3
            
            echo "=== Running Auto-Explore ==="
            pip install -r scripts/requirements.txt
            python scripts/auto_explore.py \
              --device "$(adb devices | grep emulator | awk '{print $1}')" \
              --package "$PACKAGE" \
              --max-steps "${{ inputs.test_depth == 'quick' && '15' || inputs.test_depth == 'deep' && '100' || '50' }}" \
              --output-dir artifacts
            
            echo "=== Capture Final Screenshot ==="
            mkdir -p artifacts/screenshots/final
            adb exec-out screencap -p > artifacts/screenshots/final/final_screen.png
            adb shell dumpsys window windows | grep -E "mCurrentFocus|mFocusedApp" > artifacts/logs/window_info.txt || true
            adb shell dumpsys activity activities | head -50 > artifacts/logs/activity_info.txt || true
            
            echo "=== Generating Report ==="
            python scripts/generate_report.py \
              --input-dir artifacts \
              --output-dir artifacts/reports \
              --package "$PACKAGE" \
              --device "${{ matrix.device }}" \
              --api-level "${{ matrix.api-level }}" \
              --screen "${{ matrix.screen }}"
            
            echo "=== Collecting Logs ==="
            adb logcat -d > artifacts/logs/logcat_full.txt || true
            adb shell dumpsys meminfo "$PACKAGE" > artifacts/logs/memory_info.txt || true
            adb shell dumpsys cpuinfo > artifacts/logs/cpu_info.txt || true
            
            echo "=== Done ==="

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-api${{ matrix.api-level }}-${{ matrix.device }}
          path: artifacts/
          retention-days: 30

  generate-summary:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-results/

      - name: Generate Summary Report
        run: |
          pip install jinja2
          python scripts/generate_summary.py \
            --results-dir all-results \
            --output-dir summary

      - name: Upload Summary
        uses: actions/upload-artifact@v4
        with:
          name: complete-test-report
          path: summary/
          retention-days: 90
