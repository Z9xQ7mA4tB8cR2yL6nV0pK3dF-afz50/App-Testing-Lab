name: App Testing Lab

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'APK file URL (Google Drive, direct link, etc.)'
        required: true
        type: string
      package_name:
        description: 'App package name (e.g., com.example.app)'
        required: true
        type: string
      test_depth:
        description: 'Test depth: quick (15 steps), normal (50 steps), deep (100 steps)'
        required: false
        default: 'normal'
        type: choice
        options:
          - quick
          - normal
          - deep

jobs:
  monitor-start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tunnel_url: ${{ steps.tunnel.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r monitor/requirements.txt

      - name: Start Monitor Server
        run: python monitor/server.py &

      - name: Start Cloudflare Tunnel
        id: tunnel
        run: |
          curl -Ls https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:8765 > tunnel.log 2>&1 &
          sleep 10
          TUNNEL_URL=$(grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -1)
          echo "url=$TUNNEL_URL" >> $GITHUB_OUTPUT
          echo "Dashboard URL: $TUNNEL_URL"

  monitor-keepalive:
    needs: monitor-start
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Keep tunnel alive
        run: sleep 3600

  test:
    needs: monitor-start
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 28
            device: 'pixel'
            screen: '1080x1920'
            density: 420
          - api-level: 31
            device: 'pixel_6'
            screen: '1080x2400'
            density: 411
          - api-level: 34
            device: 'pixel_7_pro'
            screen: '1440x3120'
            density: 560

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Emulator and Test App
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: ${{ matrix.device }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            mkdir -p artifacts/screenshots artifacts/reports artifacts/logs
            DEVICE_ID=$(adb devices | grep emulator | awk '{print $1}')
            MONITOR_URL="${{ needs.monitor-start.outputs.tunnel_url }}"
            echo "Device: $DEVICE_ID"
            echo "Monitor: $MONITOR_URL"

            pip install Pillow

            # Start streamer in background
            (python monitor/streamer.py \
              --server "$MONITOR_URL" \
              --device "$DEVICE_ID" \
              --device-name "${{ matrix.device }}" \
              --api-level "${{ matrix.api-level }}" \
              --screen-size "${{ matrix.screen }}" \
              --interval 3 \
              --output-dir artifacts &) || true

            wget -q "${{ inputs.apk_url }}" -O app.apk
            adb install app.apk
            sleep 2
            adb shell monkey -p "${{ inputs.package_name }}" -c android.intent.category.LAUNCHER 1
            sleep 3
            pip install -r scripts/requirements.txt
            python scripts/auto_explore.py --device "$DEVICE_ID" --package "${{ inputs.package_name }}" --max-steps "${{ inputs.test_depth == 'quick' && '15' || inputs.test_depth == 'deep' && '100' || '50' }}" --output-dir artifacts
            mkdir -p artifacts/screenshots/final
            adb exec-out screencap -p > artifacts/screenshots/final/final_screen.png
            python scripts/generate_report.py --input-dir artifacts --output-dir artifacts/reports --package "${{ inputs.package_name }}" --device "${{ matrix.device }}" --api-level "${{ matrix.api-level }}" --screen "${{ matrix.screen }}"
            adb logcat -d > artifacts/logs/logcat_full.txt || true

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-api${{ matrix.api-level }}-${{ matrix.device }}
          path: artifacts/
          retention-days: 30

  generate-summary:
    needs: test
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-results/

      - name: Generate Summary Report
        run: |
          pip install jinja2
          python scripts/generate_summary.py \
            --results-dir all-results \
            --output-dir summary

      - name: Upload Summary
        uses: actions/upload-artifact@v4
        with:
          name: complete-test-report
          path: summary/
          retention-days: 90
