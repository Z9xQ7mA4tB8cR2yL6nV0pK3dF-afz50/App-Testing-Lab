name: App Testing Lab

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'APK file URL'
        required: true
        type: string
      package_name:
        description: 'Package name'
        required: true
        type: string
      test_depth:
        description: 'Test depth'
        required: false
        default: 'normal'
        type: choice
        options: [quick, normal, deep]

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r monitor/requirements.txt -q
      - name: Start server + tunnel
        run: |
          python monitor/server.py &
          sleep 2
          curl -Ls https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:8765 > tunnel.log 2>&1 &
          sleep 10
          TUNNEL_URL=$(grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -1)
          echo "$TUNNEL_URL" > tunnel_url.txt
          echo "Dashboard: $TUNNEL_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: tunnel-url
          path: tunnel_url.txt
          retention-days: 1
          overwrite: true
      - name: Keep alive until tests finish
        run: |
          echo "Monitoring test jobs..."
          while true; do
            JOBS=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs --jq '[.jobs[] | select(.name | startswith("test")) | {status: .status, conclusion: .conclusion}]' 2>/dev/null)
            RUNNING=$(echo "$JOBS" | python3 -c "import sys,json; j=json.load(sys.stdin); print(sum(1 for x in j if x.get('status') in ('in_progress','queued','pending')))" 2>/dev/null || echo "1")
            if [ "$RUNNING" -eq 0 ] 2>/dev/null; then
              echo "All test jobs completed. Stopping monitor."
              exit 0
            fi
            echo "  $RUNNING test job(s) still running..."
            sleep 30
          done
        env:
          GH_TOKEN: ${{ github.token }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 28
            device: 'pixel'
            screen: '1080x1920'
          - api-level: 31
            device: 'pixel_6'
            screen: '1080x2400'
          - api-level: 34
            device: 'pixel_7_pro'
            screen: '1440x3120'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Wait for tunnel URL
        run: |
          echo "Waiting for monitor tunnel..."
          for i in $(seq 1 60); do
            if gh run download -n tunnel-url -D tmp 2>/dev/null; then
              TUNNEL_URL=$(cat tmp/tunnel_url.txt)
              if [ -n "$TUNNEL_URL" ]; then
                echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
                echo "Got: $TUNNEL_URL"
                break
              fi
            fi
            echo "Attempt $i/60..."
            sleep 10
          done
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: ${{ matrix.device }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            set -x
            mkdir -p artifacts/screenshots artifacts/reports artifacts/logs
            pip install Pillow -q
            pip install -r scripts/requirements.txt -q
            adb wait-for-device
            sleep 5
            adb shell settings put system screen_off_timeout 2147483647
            wget -q "${{ inputs.apk_url }}" -O app.apk
            adb install app.apk
            sleep 2
            adb shell monkey -p "${{ inputs.package_name }}" -c android.intent.category.LAUNCHER 1
            sleep 3
            python scripts/auto_explore.py --device "auto" --package "${{ inputs.package_name }}" --max-steps 50 --output-dir artifacts --server "$TUNNEL_URL" --device-label "${{ matrix.device }}-api${{ matrix.api-level }}"
            adb exec-out screencap -p > artifacts/screenshots/final_screen.png
            python scripts/generate_report.py --input-dir artifacts --output-dir artifacts/reports --package "${{ inputs.package_name }}" --device "${{ matrix.device }}" --api-level "${{ matrix.api-level }}" --screen "${{ matrix.screen }}"
            adb logcat -d > artifacts/logs/logcat_full.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-api${{ matrix.api-level }}-${{ matrix.device }}
          path: artifacts/
          retention-days: 30

  generate-summary:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/download-artifact@v4
        with: { path: all-results/ }
      - run: |
          pip install jinja2
          python scripts/generate_summary.py --results-dir all-results --output-dir summary
      - uses: actions/upload-artifact@v4
        with:
          name: complete-test-report
          path: summary/
          retention-days: 90
