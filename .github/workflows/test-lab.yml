name: App Testing Lab

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'APK file URL'
        required: true
        type: string
      package_name:
        description: 'Package name (e.g., com.example.app)'
        required: true
        type: string
      test_depth:
        description: 'Test depth'
        required: false
        default: 'normal'
        type: choice
        options: [quick, normal, deep]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 28
            device: 'pixel'
            screen: '1080x1920'
          - api-level: 31
            device: 'pixel_6'
            screen: '1080x2400'
          - api-level: 34
            device: 'pixel_7_pro'
            screen: '1440x3120'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: ${{ matrix.device }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            mkdir -p artifacts/screenshots artifacts/reports artifacts/logs
            pip install Pillow -q
            pip install -r monitor/requirements.txt -q
            pip install -r scripts/requirements.txt -q

            # Start monitor server
            python monitor/server.py &
            SERVER_PID=$!
            sleep 2

            # Start tunnel
            curl -Ls https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
            chmod +x cloudflared
            ./cloudflared tunnel --url http://localhost:8765 > tunnel.log 2>&1 &
            sleep 10
            TUNNEL_URL=$(grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -1)
            echo "Dashboard: $TUNNEL_URL"

            # Wait for device
            adb wait-for-device
            sleep 5
            DEVICE_ID=$(adb devices | grep emulator | awk '{print $1}')
            echo "Device: $DEVICE_ID"

            # Start streamer
            python monitor/streamer.py --server "$TUNNEL_URL" --device "$DEVICE_ID" --device-name "${{ matrix.device }}" --api-level "${{ matrix.api-level }}" --screen-size "${{ matrix.screen }}" --interval 3 --output-dir artifacts &
            sleep 2

            # Install and launch app
            wget -q "${{ inputs.apk_url }}" -O app.apk
            adb install app.apk
            sleep 2
            adb shell monkey -p "${{ inputs.package_name }}" -c android.intent.category.LAUNCHER 1
            sleep 3

            # Run auto-explore
            python scripts/auto_explore.py --device "$DEVICE_ID" --package "${{ inputs.package_name }}" --max-steps 50 --output-dir artifacts

            # Final screenshot
            mkdir -p artifacts/screenshots/final
            adb exec-out screencap -p > artifacts/screenshots/final/final_screen.png

            # Generate report
            python scripts/generate_report.py --input-dir artifacts --output-dir artifacts/reports --package "${{ inputs.package_name }}" --device "${{ matrix.device }}" --api-level "${{ matrix.api-level }}" --screen "${{ matrix.screen }}"

            # Save logs
            adb logcat -d > artifacts/logs/logcat_full.txt || true
            echo "TUNNEL_URL=$TUNNEL_URL" >> artifacts/tunnel_url.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-api${{ matrix.api-level }}-${{ matrix.device }}
          path: artifacts/
          retention-days: 30

  generate-summary:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/download-artifact@v4
        with: { path: all-results/ }
      - run: |
          pip install jinja2
          python scripts/generate_summary.py --results-dir all-results --output-dir summary
      - uses: actions/upload-artifact@v4
        with:
          name: complete-test-report
          path: summary/
          retention-days: 90
