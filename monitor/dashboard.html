<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Lab Monitor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 20px 30px;
            border-bottom: 1px solid #2a2a4a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 1.5rem;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status-badge {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .status-connected { background: rgba(34,197,94,0.2); color: #22c55e; }
        .status-disconnected { background: rgba(239,68,68,0.2); color: #ef4444; }
        .devices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            padding: 30px;
        }
        .device-card {
            background: #12121a;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #2a2a4a;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .device-card:hover {
            border-color: #7c3aed;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(124,58,237,0.2);
        }
        .device-header {
            padding: 15px 20px;
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid #1a1a2e;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .device-name {
            font-weight: 600;
            font-size: 1rem;
        }
        .device-api {
            background: rgba(124,58,237,0.2);
            color: #a78bfa;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
        }
        .device-preview {
            aspect-ratio: 9/16;
            background: #0a0a0f;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            min-height: 400px;
        }
        .device-preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .device-preview .placeholder {
            color: #444;
            font-size: 0.9rem;
            text-align: center;
            padding: 20px;
        }
        .device-preview .live-dot {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .device-stats {
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #888;
        }
        .device-stats span { display: flex; align-items: center; gap: 5px; }

        /* Overlay */
        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .overlay.active { display: flex; }
        .overlay-content {
            position: relative;
            max-height: 90vh;
            max-width: 90vw;
        }
        .overlay-content img {
            max-height: 90vh;
            max-width: 90vw;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .overlay-close {
            position: absolute;
            top: -40px;
            right: 0;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            opacity: 0.7;
        }
        .overlay-close:hover { opacity: 1; }
        .overlay-device-info {
            position: absolute;
            bottom: -40px;
            left: 0;
            color: #aaa;
            font-size: 0.9rem;
        }

        .no-devices {
            text-align: center;
            padding: 80px 20px;
            color: #555;
        }
        .no-devices h2 { margin-bottom: 10px; color: #777; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Test Lab Monitor</h1>
        <span id="connectionStatus" class="status-badge status-disconnected">Disconnected</span>
    </div>

    <div id="devicesGrid" class="devices-grid">
        <div class="no-devices">
            <h2>Waiting for devices...</h2>
            <p>Test jobs will appear here when they start streaming.</p>
        </div>
    </div>

    <div id="overlay" class="overlay" onclick="closeOverlay(event)">
        <div class="overlay-content">
            <span class="overlay-close" onclick="closeOverlayDirect()">&times;</span>
            <img id="overlayImage" src="" alt="Device screen">
            <div class="overlay-device-info" id="overlayInfo"></div>
        </div>
    </div>

    <script>
        let ws = null;
        let devices = {};
        let screenshots = {};

        function connect() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}/ws`);

            ws.onopen = () => {
                document.getElementById('connectionStatus').textContent = 'Connected';
                document.getElementById('connectionStatus').className = 'status-badge status-connected';
            };

            ws.onclose = () => {
                document.getElementById('connectionStatus').textContent = 'Disconnected';
                document.getElementById('connectionStatus').className = 'status-badge status-disconnected';
                setTimeout(connect, 3000);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleMessage(data);
            };
        }

        function handleMessage(data) {
            if (data.type === 'init') {
                data.devices.forEach(d => { devices[d.device_id] = d; });
                Object.assign(screenshots, data.screenshots);
                renderDevices();
            } else if (data.type === 'screenshot') {
                screenshots[data.device_id] = data.image;
                if (devices[data.device_id]) {
                    devices[data.device_id].step = data.step;
                    devices[data.device_id].screens_found = data.screens_found;
                    devices[data.device_id].status = 'streaming';
                }
                updateDevicePreview(data.device_id);
            } else if (data.type === 'devices_update') {
                data.devices.forEach(d => { devices[d.device_id] = d; });
                renderDevices();
            }
        }

        function renderDevices() {
            const grid = document.getElementById('devicesGrid');
            const deviceIds = Object.keys(devices);

            if (deviceIds.length === 0) {
                grid.innerHTML = `
                    <div class="no-devices">
                        <h2>Waiting for devices...</h2>
                        <p>Test jobs will appear here when they start streaming.</p>
                    </div>`;
                return;
            }

            grid.innerHTML = deviceIds.map(id => {
                const d = devices[id];
                const imgSrc = screenshots[id] ? `data:image/jpeg;base64,${screenshots[id]}` : '';
                return `
                    <div class="device-card" onclick="openOverlay('${id}')">
                        <div class="device-header">
                            <span class="device-name">${d.device_name || id}</span>
                            <span class="device-api">API ${d.api_level}</span>
                        </div>
                        <div class="device-preview" id="preview-${id}">
                            ${imgSrc
                                ? `<img src="${imgSrc}" alt="${id}"><div class="live-dot"></div>`
                                : `<div class="placeholder">Waiting for stream...</div>`
                            }
                        </div>
                        <div class="device-stats">
                            <span>Step: ${d.step || 0}</span>
                            <span>Screens: ${d.screens_found || 0}</span>
                            <span>${d.screen_size || ''}</span>
                        </div>
                    </div>`;
            }).join('');
        }

        function updateDevicePreview(deviceId) {
            const preview = document.getElementById(`preview-${deviceId}`);
            if (!preview || !screenshots[deviceId]) return;

            const imgSrc = `data:image/jpeg;base64,${screenshots[deviceId]}`;
            preview.innerHTML = `<img src="${imgSrc}" alt="${deviceId}"><div class="live-dot"></div>`;

            // Update stats
            const card = preview.closest('.device-card');
            if (card) {
                const stats = card.querySelector('.device-stats');
                if (stats) {
                    const d = devices[deviceId];
                    stats.innerHTML = `
                        <span>Step: ${d.step || 0}</span>
                        <span>Screens: ${d.screens_found || 0}</span>
                        <span>${d.screen_size || ''}</span>`;
                }
            }
        }

        function openOverlay(deviceId) {
            if (!screenshots[deviceId]) return;
            const overlay = document.getElementById('overlay');
            const img = document.getElementById('overlayImage');
            const info = document.getElementById('overlayInfo');

            img.src = `data:image/jpeg;base64,${screenshots[deviceId]}`;
            const d = devices[deviceId];
            info.textContent = `${d.device_name || deviceId} | API ${d.api_level} | Step ${d.step || 0}`;
            overlay.classList.add('active');
        }

        function closeOverlay(event) {
            if (event.target === document.getElementById('overlay')) {
                document.getElementById('overlay').classList.remove('active');
            }
        }

        function closeOverlayDirect() {
            document.getElementById('overlay').classList.remove('active');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeOverlayDirect();
        });

        connect();
    </script>
</body>
</html>
